config-version: 8

server:
  host: ""
  port: 8317

  tls:
    enable: false
    cert: ""
    key: ""

management:
  allow-remote: true
  secret-key: "__MANAGEMENT_KEY__"
  disable-control-panel: false
  disable-auto-update-panel: false
  panel-github-repository: "https://github.com/router-for-me/Cli-Proxy-API-Management-Center"

access:
  api-keys:
    - "__API_KEY__"

auth-dir: "/data/auth"

logging-to-file: false

debug: false
